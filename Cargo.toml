[workspace]
resolver = "2"
members = ["crates/llminate-core", "crates/llminate"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
authors = ["William Derue <william.derue@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WillIsback/llminate"
homepage = "https://github.com/WillIsback/llminate"
keywords = ["llm", "vllm", "sglang", "openai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
llminate-core = { version = "0.2.0", path = "crates/llminate-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
axum = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
